name: Import public WordPress and Google Sites archives
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install conversion dependencies
        run: python -m pip install 'requests==2.32.5' 'beautifulsoup4==4.14.2' 'markdownify==1.2.2' 'PyYAML==6.0.3'
      - name: Migrate all publicly accessible posts, pages, media and Google Sites content
        run: python scripts/migrate_public_sites.py
      - name: Show migration report
        run: cat MIGRATION_STATUS.md
      - name: Commit archives and restored content to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content archive static/media migration-report.json MIGRATION_STATUS.md
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m "Import public WordPress and Google Sites content and images"
          git push origin HEAD:main
