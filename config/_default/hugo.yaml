# Hugo site configuration. Production workflow overrides baseURL as required.
title: "Huan Ning | Geospatial AI & Research"
baseURL: "https://gladcolor.github.io/huanning/"
defaultContentLanguage: en
hasCJKLanguage: true
enableRobotsTXT: true
enableEmoji: true
summaryLength: 35
pagination:
  pagerSize: 10
permalinks:
  authors: "/author/:slug/"
outputs:
  home: [HTML, RSS, headers, redirects, backlinks]
  section: [HTML, RSS]
taxonomies:
  author: authors
  tag: tags
  category: categories
  publication_type: publication_types
markup:
  _merge: deep
build:
  writeStats: true
imaging:
  quality: 80
  anchor: smart
security:
  _merge: deep
sitemap:
  _merge: deep
