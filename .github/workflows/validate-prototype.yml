name: Validate website prototype

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: "0.136.5"
          extended: true
      - name: Build Hugo site
        run: hugo --minify --baseURL https://gladcolor.github.io/huanning/
      - name: Check generated homepage
        run: test -s public/index.html
