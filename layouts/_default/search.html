{{ define "main" }}
<div class="container narrow page">
  <header class="page-header">
    <h1 class="page-title">Search</h1>
    <p class="page-subtitle">Search news, blog posts, thoughts, projects, and publications.</p>
  </header>
  <div id="search" role="search"></div>
  <noscript>Please enable JavaScript to search. You can also browse News, Blog, Thoughts, Projects, and Publications.</noscript>
</div>
<link href="{{ "pagefind/pagefind-ui.css" | relURL }}" rel="stylesheet">
<script src="{{ "pagefind/pagefind-ui.js" | relURL }}" defer></script>
<script>window.addEventListener("DOMContentLoaded", function () { if (typeof PagefindUI !== "undefined") new PagefindUI({ element: "#search", showSubResults: true }); });</script>
{{ end }}
