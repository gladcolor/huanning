{{ $p := . }}
<article class="pub-item">
  <h3 class="pub-title"><a href="{{ $p.RelPermalink }}">{{ $p.Title }}</a></h3>
  <p class="pub-venue">{{ with $p.Params.publication }}<span>{{ . }}</span>{{ else }}<span>{{ $p.Date.Format "2006" }}</span>{{ end }}{{ with $p.Params.doi }}<a href="https://doi.org/{{ . }}" target="_blank" rel="noopener noreferrer">DOI</a>{{ end }}</p>
</article>
