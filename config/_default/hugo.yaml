title: "Huan Ning | Geospatial AI and Autonomous GIS"
baseURL: "https://www.huanning.me/"
languageCode: "en-us"
defaultContentLanguage: en
enableRobotsTXT: true
enableGitInfo: false
summaryLength: 34
pagination:
  pagerSize: 12
outputs:
  home: [HTML, RSS]
  section: [HTML, RSS]
taxonomies:
  tag: tags
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    style: github
    noClasses: false
module:
  mounts:
    - source: static
      target: static
    - source: assets
      target: assets
    # Also expose uploaded media to Hugo's image pipeline for small card thumbnails.
    - source: static/media
      target: assets/media
