
<p class="wp-block-paragraph">I use CSV file for a long time to process a lot of tabular data. However, one of my recent project need to extract rows from a large parquet table. After a few testing, I found that DuckDB can speed up my work by about 5 times. I recommend to try Parquet and DuckDB if you need a fast processing.</p>
